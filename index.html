<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Saw Forge Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23171a1d'/%3E%3Cpath d='M2 12L7 4v8l5-8v8' fill='none' stroke='%23ff8f3c' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div id="root"></div>
<div id="boot-error" hidden></div>
<script>
  if (location.protocol === 'file:') {
    const el = document.getElementById('boot-error');
    el.hidden = false;
    el.innerHTML = '<h1>Saw Forge Studio needs a local server</h1><p>Browsers block audio worklets and modules from <code>file://</code>. In this folder run:</p><pre>python serve.py</pre><p>then open <b>http://127.0.0.1:8765</b> in Chrome or Edge.</p>';
  }
  window.addEventListener('error', (e) => {
    const el = document.getElementById('boot-error');
    if (!el || window.__booted) return;
    el.hidden = false;
    el.innerHTML = '<h1>Saw Forge Studio failed to start</h1><pre></pre>';
    el.querySelector('pre').textContent = String(e.message || e.error);
  });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
