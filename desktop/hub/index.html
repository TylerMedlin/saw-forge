<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Saw Forge Hub</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img src="img/hub-icon.png" alt="" width="28" height="28"><b>Saw Forge</b><span>Hub</span><span id="hub-ver" class="brand-ver" title="Saw Forge Hub version"></span></div>
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" type="search" placeholder="Search apps" autocomplete="off"></label>
    <div class="top-actions">
      <button class="icon-btn" id="refresh" title="Check for updates"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
      <button class="icon-btn" data-nav="settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </div>
  </header>
  <nav class="side">
    <div class="side-group">Apps</div>
    <button data-nav="all" class="on"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>All apps</button>
    <button data-nav="installed"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>Installed</button>
    <button data-nav="updates"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13.5h10"/></svg>Updates<span class="badge" id="upd-badge" hidden>0</span></button>
    <div class="side-group">Resources</div>
    <button data-nav="whatsnew"><svg viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3 4.3 13.3l.8-4.1L2 6.3l4.2-.5z"/></svg>What's new</button>
    <button data-link="guide"><svg viewBox="0 0 16 16"><path d="M3 2.5h7l3 3v8H3z M10 2.5v3h3"/></svg>Install guide</button>
    <button data-link="source"><svg viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg>Source code</button>
    <button data-link="issues"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.8M8 10.8v.4"/></svg>Report a problem</button>
    <div class="side-fill"></div>
    <button data-nav="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/></svg>Settings</button>
    <button data-nav="about"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v4M8 4.8v.4"/></svg>About</button>
  </nav>
  <main id="view" tabindex="-1"></main>
  <footer class="status"><span id="status-left"></span><span class="sp"></span><span id="status-right"></span></footer>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="hub.js"></script>
</body>
</html>
