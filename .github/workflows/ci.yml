# On every push and pull request: pack the apps reproducibly and run the
# desktop self-test on Windows and macOS (install → boot → audio engine →
# save/load → uninstall), so a broken desktop build never gets released.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run pack-apps
      - name: Packages are reproducible
        shell: bash
        run: |
          sha1=$(sha256sum dist-apps/*.zip); npm run pack-apps >/dev/null; sha2=$(sha256sum dist-apps/*.zip)
          [ "$sha1" = "$sha2" ] && echo "$sha1"
      - name: Desktop self-test
        run: npx electron . --selftest
