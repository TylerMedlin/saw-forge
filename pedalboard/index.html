<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Saw Forge — Worship Pedalboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23171a1d'/%3E%3Crect x='4' y='3' width='8' height='10' rx='1.5' fill='none' stroke='%23ff8f3c' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='10' r='1.3' fill='%23ff8f3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/pedalboard.css">
</head>
<body>
<div id="root"></div>
<div id="boot-error" hidden></div>
<script>
  // The desktop self-test loads this worklet to prove the audio engine works.
  window.__sawforgeWorklet = '/src/audio/pedalboard-processor.js';
  if (location.protocol === 'file:') {
    const el = document.getElementById('boot-error');
    el.hidden = false;
    el.innerHTML = '<h1>Worship Pedalboard needs a local server</h1><p>Browsers block audio worklets and modules from <code>file://</code>. In the Saw Forge folder run:</p><pre>python serve.py</pre><p>then open <b>http://127.0.0.1:8765/pedalboard/</b> in Chrome or Edge.</p>';
  }
  window.addEventListener('error', (e) => {
    const el = document.getElementById('boot-error');
    if (!el || window.__booted) return;
    el.hidden = false;
    el.innerHTML = '<h1>Worship Pedalboard failed to start</h1><pre></pre>';
    el.querySelector('pre').textContent = String(e.message || e.error);
  });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
